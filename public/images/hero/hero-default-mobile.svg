<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" preserveAspectRatio="xMidYMid slice">
<title>Media Gudang Acc</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
    <stop offset="0" stop-color="#0b2c31"/><stop offset="0.5" stop-color="#17454c"/><stop offset="1" stop-color="#1a7f8a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5fc3cc" stop-opacity="0.55"/><stop offset="1" stop-color="#5fc3cc" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sun" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#fbb48a"/><stop offset="0.55" stop-color="#f68e55"/><stop offset="1" stop-color="#e2713b"/>
  </linearGradient>
  <linearGradient id="ped" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d8d2c4"/><stop offset="0.35" stop-color="#f4f2ed"/><stop offset="0.7" stop-color="#e9e5dc"/><stop offset="1" stop-color="#c9c1b0"/>
  </linearGradient>
  <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2aa7b3"/><stop offset="0.6" stop-color="#1a7f8a"/><stop offset="1" stop-color="#145f68"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e2d9"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.32"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.09"/></pattern>
  <g id="spark"><path d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14Z"/></g>
  <!-- Isi poster: blok judul, label diskon, baris teks -->
  <g id="artwork">
    <rect width="100" height="136" fill="url(#poster)"/>
    <circle cx="72" cy="34" r="18" fill="#f68e55"/>
    <path d="M64.5 41.5 L79.5 26.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="66" cy="28" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.4"/><circle cx="78" cy="40" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <rect x="12" y="74" width="64" height="9" rx="2" fill="#ffffff"/>
    <rect x="12" y="89" width="46" height="9" rx="2" fill="#ffffff"/>
    <rect x="12" y="112" width="32" height="6" rx="3" fill="#fbb48a"/>
  </g>
  <g id="scene">
    <circle cx="300" cy="250" r="262" fill="url(#sun)"/>
    <circle cx="300" cy="250" r="262" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="2 10"/>
    <ellipse cx="300" cy="664" rx="300" ry="30" fill="#000" opacity="0.32" filter="url(#soft)"/>

    <!-- X banner -->
    <g transform="translate(18 108)">
      <path d="M-6 -6 L162 426 M162 -6 L-6 426" stroke="#10292d" stroke-width="7" stroke-linecap="round"/>
      <rect x="6" y="8" width="160" height="430" fill="#000" opacity="0.3" filter="url(#softer)"/>
      <rect x="0" y="0" width="156" height="420" fill="url(#white)"/>
      <rect x="0" y="0" width="156" height="160" fill="#f68e55"/>
      <circle cx="78" cy="80" r="44" fill="#ffffff" fill-opacity="0.9"/>
      <path d="M60 98 L96 62" stroke="#f68e55" stroke-width="7" stroke-linecap="round"/><circle cx="63" cy="66" r="8" fill="none" stroke="#f68e55" stroke-width="5"/><circle cx="93" cy="94" r="8" fill="none" stroke="#f68e55" stroke-width="5"/>
      <rect x="22" y="190" width="112" height="16" rx="3" fill="#10292d"/>
      <rect x="22" y="216" width="84" height="16" rx="3" fill="#10292d"/>
      <rect x="22" y="252" width="112" height="7" rx="3.5" fill="#9aa6a7"/>
      <rect x="22" y="268" width="96" height="7" rx="3.5" fill="#9aa6a7"/>
      <rect x="22" y="284" width="104" height="7" rx="3.5" fill="#9aa6a7"/>
      <rect x="22" y="352" width="112" height="40" rx="20" fill="#21939f"/>
      <path d="M78 420 V548 M78 520 L30 556 M78 520 L126 556" stroke="#10292d" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Tripod banner dengan frame akrilik -->
    <g transform="translate(196 52)">
      <path d="M130 20 V500" stroke="#10292d" stroke-width="9" stroke-linecap="round"/>
      <path d="M130 455 L36 612 M130 455 L224 612 M130 455 L138 590" stroke="#10292d" stroke-width="8" stroke-linecap="round"/>
      <rect x="10" y="14" width="260" height="350" rx="8" fill="#000" opacity="0.35" filter="url(#soft)"/>
      <use href="#artwork" transform="translate(20 22) scale(2.2)"/>
      <rect x="2" y="2" width="256" height="344" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
      <path d="M30 30 L110 30" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
      <rect x="110" y="-6" width="40" height="16" rx="4" fill="#10292d"/>
      <rect x="110" y="338" width="40" height="16" rx="4" fill="#10292d"/>
    </g>

    <!-- Standing sign & tempat brosur di atas meja display -->
    <g transform="translate(446 476)">
      <ellipse cx="78" cy="178" rx="90" ry="12" fill="#000" opacity="0.3" filter="url(#softer)"/>
      <path d="M0 40 L20 22 H160 L140 40Z" fill="#faf9f6"/>
      <rect x="0" y="40" width="140" height="140" fill="url(#ped)"/>
      <path d="M140 40 L160 22 V162 L140 180Z" fill="#bfb6a3"/>
      <g transform="translate(14 -92) rotate(-4)">
        <rect x="0" y="0" width="74" height="98" rx="3" fill="#10292d"/>
        <use href="#artwork" transform="translate(5 5) scale(0.64)"/>
        <rect x="5" y="5" width="64" height="88" fill="url(#glass)"/>
        <path d="M30 98 L22 128 M44 98 L52 128" stroke="#10292d" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(96 -34)">
        <rect x="6" y="-14" width="40" height="56" rx="2" fill="#ffffff"/>
        <rect x="12" y="-6" width="28" height="12" fill="#f68e55"/>
        <rect x="12" y="10" width="22" height="4" fill="#9aa6a7"/>
        <rect x="0" y="12" width="52" height="54" rx="3" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
      </g>
    </g>
  </g>
</defs>
<rect width="900" height="1600" fill="url(#bg)"/>
<rect width="900" height="1600" fill="url(#dots)"/>
<circle cx="450" cy="420" r="520" fill="url(#glow)"/>

<use href="#scene" transform="translate(165 80) scale(0.95)"/>
<use href="#spark" transform="translate(140 170) scale(1.2)" fill="#f68e55"/><use href="#spark" transform="translate(800 140) scale(0.9)" fill="#ffffff"/><use href="#spark" transform="translate(820 700) scale(1.0)" fill="#fbb48a"/>
</svg>
